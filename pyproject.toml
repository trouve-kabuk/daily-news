[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-news"
version = "0.1.0"
description = "A local, auditable news collection and review pipeline"
requires-python = ">=3.13"
dependencies = [
  "feedparser>=6.0.11,<7",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "rich>=13.9,<15",
  "trafilatura>=2.2,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
llama = [
  "huggingface-hub>=0.30,<2",
  "llama-cpp-python>=0.3.16,<1",
]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
daily-news = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "app/default_config"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = [
  "ignore:To avoid breaking existing software.*:DeprecationWarning:feedparser.util",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = [
  "feedparser",
  "huggingface_hub",
  "huggingface_hub.utils",
  "llama_cpp",
  "mlx_lm",
  "trafilatura",
]
ignore_missing_imports = true
